<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style: none;
            padding-left: 0;
        }
    </style>
</head>
<body>

    <h1>MY Task App</h1>

    <input id="input"  type="text">
    
    <button id="add">追加</button><button id="cancel" hidden>キャンセル</button><button id="complete">完了</button><button id="del">削除</button>
    <ul></ul>
   
<script>
    // 編集中のタスク番号を覚えておく
    let editingNumber = null;

     //キャンセルしたときの処理
    document.getElementById("cancel").addEventListener("click", function() {
        editingNumber = null;
        document.getElementById("input").value = "";
        document.getElementById("add").textContent = "追加";
        document.getElementById("cancel").hidden = true;
    });

//「追加」がクリックされたら、{ } の中の処理を実行する」//
    document.getElementById("add").addEventListener("click",function(){
        //trim()は文字の前後にある余分な空白を取り除く//
        const text = document.getElementById("input").value.trim();
        //テキストに何も記載されていない時アラートを表示。===で比較の完全一致を表す。
        if (text === "") {
            alert("タスク名を入力してください");
            return;
        }
       
        if (editingNumber !== null) {
            fetch("/tasks/update", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    number: Number(editingNumber),
                    name: text
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("更新に失敗しました");
                }
                const liList = document.querySelectorAll("li");
                for (const li of liList) {
                    if (Number(li.dataset.number) === Number(editingNumber)) {
                        const taskName = li.querySelector(".task-name");
                        taskName.textContent = text;
                    }
                }
                editingNumber = null;
                document.getElementById("input").value = "";
                document.getElementById("add").textContent = "追加";
                document.getElementById("cancel").hidden = false;
            })
            .catch(error => {
                console.error(error);
                alert("更新に失敗しました");
            });
            return;
        }

        //「新しい<li>要素を作成//
        const li = document.createElement("li");
        //チェックボックスという名前で新しく作った。"input"になっている理由はチェックボックスはinputタイプだから//
        const checkbox = document.createElement("input");
         //タイプはチェックボックス//
        checkbox.type = "checkbox";
        //liに追加した要素を戻り値として受け取る。append()では受け取れないため。
        li.appendChild(checkbox);
        const editButton = document.createElement("button");
        editButton.textContent = "編集";

//編集ボタンををした時の処理
        editButton.addEventListener("click", function() {
            const taskName = li.querySelector(".task-name");
            document.getElementById("input").value = taskName.textContent;
            editingNumber = li.dataset.number;
            document.getElementById("add").textContent = "更新";
            document.getElementById("cancel").hidden = false;
        });
        li.appendChild(editButton);
        const taskName = document.createElement("span");
        taskName.className = "task-name";
        taskName.textContent = text;
        li.appendChild(taskName);

        //JavaScriptから、サーバー（Spring Boot）にお願いをするための機能//
        //JavaScript       ───────→        Spring Boot
        //fetch("/tasks")  ───────→  @PostMapping("/tasks")という関係//

        fetch("/tasks", {
            //tasksにデータを送りますという意味//
            method: "POST",
            //headers:これから送るデータはJSONという形式ですよという意味//
            headers: {
                "Content-Type": "application/json"
            },
            //body：実際に送るデータを入れる。//
             //JSON.stringify()：JavaScriptのデータを、JSONという文字列の形式に変換する。//
            body: JSON.stringify({
            name: text
            })
        //まとめると「Spring Bootの /tasks に、POSTで、JSON形式の『name＝入力されたタスク名』を送ってください」となる//
        })
        //ここからは、Java側から返事が戻ってきた後の処理//
        //then:前の処理が終わったら、次の処理をする//
        //response:javaから帰ってきた返事//
        //json() は、その返事の本文をJSONデータとして読み取る処理//
        .then(response => response.json())
        .then(task => {
        checkbox.dataset.number = task.number;
        li.dataset.number = task.number;
        })
        //作成したliをulの子要素として追加し、画面に表示する
        document.querySelector("ul").appendChild(li);
    })


//「完了」ボタンがクリックされたときに、タスクの一覧を取得する処理    
        document.getElementById("complete").addEventListener("click", function() {
            const liList = document.querySelectorAll("li");

            for (const li of liList) {
                const checkbox = li.querySelector("input");

                if (checkbox.checked) {
                    const number = checkbox.dataset.number;

                    fetch("/tasks/complete", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            number: Number(number)
                        })
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("完了処理に失敗しました");
                        }

                        const taskName = li.querySelector(".task-name");
                        taskName.style.textDecoration = "line-through";
                        checkbox.checked = false;
                    })
                    .catch(error => {
                        console.error(error);
                        alert("完了処理に失敗しました");
                    });
                }
            }
        });


//「削除」がクリックされたら{ }の中の処理を実行する//
        document.getElementById("del").addEventListener("click", function(){
            //新しいulの要素を作った//
            const ul = document.querySelector("ul");
                //ulの中に入っているliを全て選択する//
            const liList = ul.querySelectorAll("li");
            //liの中にある選択したリストを一つずつ見ていく//
            for (const li of liList) {
                //checkboxという定数にliの中を調べた時に<input>タグ（チェックボックス）が付いているものをいれる//
                //目では見えないけどチェックがついていると中では
                // <li>　
                // <input type="checkbox">　
                // Java　
                // </li>　
                // ということが起きている
                const checkbox = li.querySelector("input");
                console.log(checkbox);
                if (checkbox.checked) {
                    //チェックボックスの中のデータセットの中のナンバーをナンバーという名前の中に入れる//
                   const number = checkbox.dataset.number;
                    //JavaScriptから、サーバー（Spring Boot）にお願いをするための機能 ここでは削除のお願い//
                    fetch("/tasks", { method: "DELETE" ,
                
                      headers: {
                        "Content-Type": "application/json"
                        },

                    body: JSON.stringify({
                        number: number
                    })
                });
                    li.remove();
                }

            }
        });

        ///tasks にGETでデータをくださいという意味　fetch() は、何も指定しない場合はGETになる//
        fetch("/tasks")
        //Javaからデータが返ってくると、responseという名前で、返ってきたものを受け取って、返ってきたデータをJavaScriptで扱える形にしてください//
        .then(response => response.json())
        //Javaから返ってきたデータを tasks という名前で受け取る//
        //JavaScript側の tasks は、Javaから返ってきたデータを一時的に入れておく名前であってjavaのtasksとは別物。//
        .then(tasks => {
            //受け取った tasks の中身をコンソールに表示する//
            console.log(tasks);
             //tasks の中から、タスクを1個ずつ取り出して処理する//
                    
            for (const task of tasks) {
                const li = document.createElement("li");
                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.dataset.number = task.number;

                const taskName = document.createElement("span");
                taskName.className = "task-name";
                taskName.textContent = task.name;
                const editButton = document.createElement("button");
                editButton.textContent = "編集";

                editButton.addEventListener("click", function() {
                    document.getElementById("input").value = task.name;
                    editingNumber = task.number;
                    document.getElementById("add").textContent = "更新";
                    document.getElementById("cancel").hidden = false;
                });

                if (task.completed) {
                    taskName.style.textDecoration = "line-through";
                }

                li.dataset.number = task.number;
                li.appendChild(checkbox);
                li.appendChild(editButton);
                li.appendChild(taskName);

                document.querySelector("ul").appendChild(li);
            }
        });

       
       

    
</script>

</body>
</html>
